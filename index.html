<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AR 에어 캔버스 (Air Canvas)</title>
  
  <!-- MediaPipe 라이브러리 CDN 로드 -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }
    #app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    /* 웹캠 및 드로잉 캔버스 */
    video {
      display: none;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1); /* 거울 모드 (자연스러운 인터랙션) */
    }
    /* 상단 상태창 HUD */
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .status-badge {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 18px;
      border-radius: 9999px;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      backdrop-filter: blur(8px);
    }
    #pinch-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
      background-color: #94a3b8;
    }
    #pinch-indicator.active {
      background-color: #22c55e;
      box-shadow: 0 0 10px #22c55e;
    }

    /* 하단 AR 툴바 */
    #toolbar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 18px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      z-index: 10;
    }
    .color-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 3px solid transparent;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }
    .color-btn.selected {
      transform: scale(1.15);
      border-color: #fff;
    }
    .action-btn {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: none;
      padding: 0 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: background 0.2s;
    }
    .action-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* 초기 시작 모달 */
    #overlay-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 15, 30, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      color: white;
      text-align: center;
      padding: 24px;
    }
    #overlay-screen h1 {
      font-size: 2.2rem;
      margin-bottom: 12px;
      color: #38bdf8;
    }
    #overlay-screen p {
      font-size: 1.1rem;
      color: #cbd5e1;
      max-width: 480px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    #start-btn {
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      border: none;
      color: #fff;
      font-size: 1.2rem;
      font-weight: 700;
      padding: 16px 36px;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(14, 165, 233, 0.5);
    }
  </style>
</head>
<body>

  <div id="app-container">
    <video id="webcam" playsinline></video>
    <canvas id="output_canvas"></canvas>

    <div id="hud">
      <div class="status-badge">
        <span id="pinch-indicator"></span>
        <span id="status-text">카메라 대기 중</span>
      </div>
      <div class="status-badge" style="font-size: 0.85rem; color: #94a3b8;">
        🖐️ 엄지+검지 꼬집기(Pinch) = 그리기
      </div>
    </div>

    <div id="toolbar">
      <button class="color-btn selected" style="background-color: #00f0ff;" data-color="#00f0ff"></button>
      <button class="color-btn" style="background-color: #ff0055;" data-color="#ff0055"></button>
      <button class="color-btn" style="background-color: #ffe600;" data-color="#ffe600"></button>
      <button class="color-btn" style="background-color: #00ff66;" data-color="#00ff66"></button>
      <button class="color-btn" style="background-color: #ffffff;" data-color="#ffffff"></button>
      <button class="action-btn" id="clear-btn">전체 지우기</button>
    </div>

    <div id="overlay-screen">
      <h1>✨ AR Air Canvas</h1>
      <p>
        허공에서 손가락으로 그림을 그리는 공간 드로잉 웹앱입니다.<br>
        <strong>엄지와 검지를 모아서 꼬집으면</strong> 선이 그려지고,<br>
        손가락을 떼면 위치만 이동합니다.
      </p>
      <button id="start-btn">카메라 켜고 시작하기</button>
    </div>
  </div>

  <script>
    // --- 캔버스 설정 ---
    const canvas = document.getElementById('output_canvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('webcam');
    const statusText = document.getElementById('status-text');
    const pinchIndicator = document.getElementById('pinch-indicator');
    const startBtn = document.getElementById('start-btn');
    const overlayScreen = document.getElementById('overlay-screen');

    let currentColor = '#00f0ff';
    let brushSize = 6;
    let strokes = []; // 모든 그려진 선 목록: Array<{ color, size, points: Array<{x, y}> }>
    let currentStroke = null;

    // 파티클 이펙트 배열
    let particles = [];

    // 좌표 떨림 보정을 위한 EMA 필터 좌표
    let smoothX = null;
    let smoothY = null;
    const SMOOTHING_FACTOR = 0.55; // 0~1 (높을수록 즉각 반응, 낮을수록 부드러움)

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- 파티클 클래스 (네온 스파크) ---
    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.size = Math.random() * 4 + 2;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3 + 1;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.alpha = 1;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= 0.04;
      }
      draw(context) {
        context.save();
        context.globalAlpha = Math.max(0, this.alpha);
        context.fillStyle = this.color;
        context.beginPath();
        context.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        context.fill();
        context.restore();
      }
    }

    // --- MediaPipe Hands 설정 ---
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.65,
      minTrackingConfidence: 0.65
    });

    hands.onResults(onResults);

    function onResults(results) {
      // 1. 카메라 영상 출력
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

      let isPinching = false;
      let targetX = 0;
      let targetY = 0;

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];

        // 엄지 끝(4)과 검지 끝(8) 좌표
        const thumbTip = landmarks[4];
        const indexTip = landmarks[8];

        // 3D 유클리드 거리 계산을 통한 핀치 감지
        const pinchDistance = Math.hypot(
          thumbTip.x - indexTip.x,
          thumbTip.y - indexTip.y,
          thumbTip.z - indexTip.z
        );

        // 엄지와 검지의 중간점을 그리기 지점으로 설정
        const midX = ((thumbTip.x + indexTip.x) / 2) * canvas.width;
        const midY = ((thumbTip.y + indexTip.y) / 2) * canvas.height;

        // 지수 이동평균 필터로 손 떨림 감소
        if (smoothX === null) {
          smoothX = midX;
          smoothY = midY;
        } else {
          smoothX = smoothX + SMOOTHING_FACTOR * (midX - smoothX);
          smoothY = smoothY + SMOOTHING_FACTOR * (midY - smoothY);
        }

        targetX = smoothX;
        targetY = smoothY;

        // 핀치 임계값 (0.075 이하일 때 꼬집은 상태로 판단)
        if (pinchDistance < 0.075) {
          isPinching = true;
        }

        // 손가락 관절 시각화 (가벼운 포인터 링)
        drawCursor(targetX, targetY, isPinching);
      } else {
        smoothX = null;
        smoothY = null;
      }

      // 2. 드로잉 상태 업데이트
      if (isPinching) {
        statusText.textContent = '그리는 중 ✨';
        pinchIndicator.classList.add('active');

        if (!currentStroke) {
          currentStroke = { color: currentColor, size: brushSize, points: [] };
          strokes.push(currentStroke);
        }
        currentStroke.points.push({ x: targetX, y: targetY });

        // 네온 파티클 생성
        for (let i = 0; i < 2; i++) {
          particles.push(new Particle(targetX, targetY, currentColor));
        }
      } else {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
          statusText.textContent = '이동 중 (손끝을 모아보세요)';
        } else {
          statusText.textContent = '손을 비춰주세요';
        }
        pinchIndicator.classList.remove('active');
        currentStroke = null;
      }

      // 3. 기록된 모든 드로잉 선 렌더링 (Glow 네온 효과)
      renderStrokes();

      // 4. 파티클 업데이트 및 렌더링
      renderParticles();

      ctx.restore();
    }

    function drawCursor(x, y, isPinching) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, isPinching ? 8 : 14, 0, Math.PI * 2);
      ctx.fillStyle = isPinching ? currentColor : 'rgba(255, 255, 255, 0.4)';
      ctx.shadowColor = currentColor;
      ctx.shadowBlur = 15;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#fff';
      ctx.stroke();
      ctx.restore();
    }

    function renderStrokes() {
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      strokes.forEach(stroke => {
        if (stroke.points.length < 2) return;

        ctx.strokeStyle = stroke.color;
        ctx.lineWidth = stroke.size;
        ctx.shadowColor = stroke.color;
        ctx.shadowBlur = 18; // 네온 광선 효과

        ctx.beginPath();
        ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
        for (let i = 1; i < stroke.points.length; i++) {
          ctx.lineTo(stroke.points[i].x, stroke.points[i].y);
        }
        ctx.stroke();
      });
      ctx.restore();
    }

    function renderParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw(ctx);
        if (particles[i].alpha <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    // --- UI 이벤트 리스너 ---
    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
        e.target.classList.add('selected');
        currentColor = e.target.getAttribute('data-color');
      });
    });

    document.getElementById('clear-btn').addEventListener('click', () => {
      strokes = [];
      particles = [];
    });

    // --- 카메라 시작 ---
    let cameraInstance = null;
    startBtn.addEventListener('click', async () => {
      overlayScreen.style.display = 'none';
      cameraInstance = new Camera(video, {
        onFrame: async () => {
          await hands.send({ image: video });
        },
        width: 1280,
        height: 720
      });
      await cameraInstance.start();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D AI Air Beat Saber (Speed Control)</title>

  <!-- MediaPipe Hands & Camera Utils CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05050c;
      color: #fff;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    video {
      display: none;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1); /* 거울 모드 */
    }

    /* 상단 HUD (점수, 콤보) */
    #hud {
      position: absolute;
      top: 20px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }
    .hud-box {
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid rgba(255, 255, 255, 0.2);
      padding: 8px 20px;
      border-radius: 16px;
      text-align: center;
      backdrop-filter: blur(8px);
    }
    .hud-title {
      font-size: 0.8rem;
      color: #94a3b8;
      letter-spacing: 1.5px;
      font-weight: 700;
    }
    .hud-value {
      font-size: 1.8rem;
      font-weight: 900;
      color: #38bdf8;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.8);
    }
    #combo-value {
      color: #f43f5e;
      text-shadow: 0 0 15px rgba(244, 63, 94, 0.8);
    }

    /* 🎮 속도 및 테스트 조절 컨트롤러 (상단 중앙) */
    #speed-control-panel {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #38bdf8;
      padding: 10px 20px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 20;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
    }
    #speed-control-panel label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #38bdf8;
      white-space: nowrap;
    }
    #speed-slider {
      width: 130px;
      cursor: pointer;
    }
    .preset-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .preset-btn.active {
      background: #38bdf8;
      color: #000;
      border-color: #38bdf8;
      font-weight: 800;
    }

    #judgment {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3.2rem;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 2px;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.1s, transform 0.1s;
    }
    #judgment.perfect {
      color: #38bdf8;
      text-shadow: 0 0 30px #38bdf8;
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.15);
    }
    #judgment.miss {
      color: #64748b;
      text-shadow: 0 0 20px #475569;
      opacity: 1;
      transform: translate(-50%, -50%) scale(0.9);
    }

    #start-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 5, 12, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      text-align: center;
      padding: 24px;
    }
    #start-modal h1 {
      font-size: 2.8rem;
      font-weight: 900;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #f43f5e, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #start-modal p {
      font-size: 1.1rem;
      color: #cbd5e1;
      max-width: 580px;
      line-height: 1.8;
      margin-bottom: 25px;
    }
    #start-btn {
      background: linear-gradient(135deg, #f43f5e, #38bdf8);
      border: none;
      color: #fff;
      font-size: 1.2rem;
      font-weight: 800;
      padding: 16px 40px;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.6);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <video id="webcam" playsinline></video>
    <canvas id="game-canvas"></canvas>

    <!-- 🎛️ 속도 조절 컨트롤러 UI -->
    <div id="speed-control-panel">
      <label>속도 설정:</label>
      <input type="range" id="speed-slider" min="1.0" max="5.0" step="0.5" value="4.0" />
      <span id="speed-text" style="font-size: 0.85rem; font-weight: 700; width: 45px;">4.0초</span>
      <button class="preset-btn active" data-speed="4.0">느림(테스트)</button>
      <button class="preset-btn" data-speed="2.5">보통</button>
      <button class="preset-btn" data-speed="1.5">빠름</button>
    </div>

    <div id="hud">
      <div class="hud-box">
        <div class="hud-title">SCORE</div>
        <div class="hud-value" id="score-value">0</div>
      </div>
      <div class="hud-box">
        <div class="hud-title">COMBO</div>
        <div class="hud-value" id="combo-value">0</div>
      </div>
    </div>

    <div id="judgment">PERFECT!</div>

    <div id="start-modal">
      <h1>⚡ 3D AIR BEAT SABER</h1>
      <p>
        🔴 <strong>왼손: 빨간 검</strong> &nbsp;|&nbsp; 🔵 <strong>오른손: 파란 검</strong><br>
        상자가 날아오는 속도를 상단에서 자유롭게 변경할 수 있습니다.<br>
        먼저 <strong>느림 모드</strong>로 손동작과 베는 타이밍을 맞춰보세요!
      </p>
      <button id="start-btn">비트 시작하기 (카메라/사운드 On)</button>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. Web Audio API 신디사이저 엔진
    // ==========================================
    const BPM = 120;
    const SECONDS_PER_BEAT = 60 / BPM; // 0.5초 = 1비트
    let audioCtx = null;
    let nextNoteTime = 0;
    let beatStep = 0;
    let isAudioPlaying = false;

    // ⚡ 큐브가 생성되어 판정선까지 도달하는 시간 (기본값: 4.0초 = 아주 느림)
    let travelDuration = 4.0; 

    function initAudio() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      nextNoteTime = audioCtx.currentTime + 0.1;
      isAudioPlaying = true;
      scheduleMusic();
    }

    function scheduleMusic() {
      if (!isAudioPlaying) return;
      while (nextNoteTime < audioCtx.currentTime + 0.2) {
        playBeat(beatStep, nextNoteTime);
        spawnNoteOnBeat(beatStep, nextNoteTime);
        nextNoteTime += SECONDS_PER_BEAT / 2; // 8분음표
        beatStep++;
      }
      setTimeout(scheduleMusic, 25);
    }

    function playBeat(step, time) {
      const isQuarterBeat = step % 2 === 0;
      const quarterIndex = (step / 2) % 4;

      if (isQuarterBeat) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(140, time);
        osc.frequency.exponentialRampToValueAtTime(32, time + 0.11);
        gain.gain.setValueAtTime(0.7, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.13);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(time);
        osc.stop(time + 0.14);
      }

      if (isQuarterBeat && (quarterIndex === 1 || quarterIndex === 3)) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(200, time);
        gain.gain.setValueAtTime(0.35, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.15);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(time);
        osc.stop(time + 0.16);
      }

      if (!isQuarterBeat) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(7500, time);
        gain.gain.setValueAtTime(0.12, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.035);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(time);
        osc.stop(time + 0.04);
      }
    }

    function playSliceSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(660, now);
      osc.frequency.exponentialRampToValueAtTime(1400, now + 0.08);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.11);
    }


    // ==========================================
    // 2. 3D 공간 수학 및 노트 엔진
    // ==========================================
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const scoreValEl = document.getElementById('score-value');
    const comboValEl = document.getElementById('combo-value');
    const judgmentEl = document.getElementById('judgment');

    let score = 0;
    let combo = 0;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const FOV = 420;
    const HIT_PLANE_Z = 130;
    const SPAWN_Z = 1200;

    let notes = [];
    let particles = [];

    const DIRECTIONS = {
      'UP':    { dx: 0,  dy: -1, symbol: '▲' },
      'DOWN':  { dx: 0,  dy: 1,  symbol: '▼' },
      'LEFT':  { dx: -1, dy: 0,  symbol: '◀' },
      'RIGHT': { dx: 1,  dy: 0,  symbol: '▶' }
    };
    const DIR_KEYS = ['UP', 'DOWN', 'LEFT', 'RIGHT'];

    class BeatNote {
      constructor(targetTime, type, duration) {
        this.targetTime = targetTime;
        this.duration = duration; // 생성 시점의 도달 시간 기준
        this.type = type; // 0: RED (Left), 1: BLUE (Right)
        this.color = type === 0 ? '#f43f5e' : '#38bdf8';
        this.dirKey = DIR_KEYS[Math.floor(Math.random() * DIR_KEYS.length)];
        this.direction = DIRECTIONS[this.dirKey];
        this.worldX = type === 0 ? -180 : 180;
        this.worldY = 40;
        this.size = 110;
        this.isHit = false;
        this.isMissed = false;
      }

      update(currentTime) {
        const timeRemaining = this.targetTime - currentTime;
        const progress = 1 - (timeRemaining / this.duration);
        this.z = SPAWN_Z - progress * (SPAWN_Z - HIT_PLANE_Z);

        this.scale = FOV / this.z;
        this.screenX = (canvas.width / 2) + (this.worldX * this.scale);
        this.screenY = (canvas.height / 2) + (this.worldY * this.scale);
        this.screenSize = this.size * this.scale;

        // 판정선을 여유롭게 지나친 뒤 미스 처리
        if (timeRemaining < -0.3 && !this.isHit && !this.isMissed) {
          this.isMissed = true;
          triggerJudgment('MISS');
        }
      }

      draw(context) {
        if (this.z < 60 || this.isHit) return;

        context.save();
        context.translate(this.screenX, this.screenY);

        context.fillStyle = 'rgba(15, 23, 42, 0.85)';
        context.strokeStyle = this.color;
        context.lineWidth = Math.max(3, 7 * this.scale);
        context.shadowColor = this.color;
        context.shadowBlur = 15 * this.scale;

        const half = this.screenSize / 2;
        context.beginPath();
        context.roundRect(-half, -half, this.screenSize, this.screenSize, 12 * this.scale);
        context.fill();
        context.stroke();

        context.fillStyle = '#ffffff';
        context.font = `900 ${this.screenSize * 0.52}px sans-serif`;
        context.textAlign = 'center';
        context.textBaseline = 'middle';
        context.fillText(this.direction.symbol, 0, 0);

        context.restore();
      }
    }

    // 4비트마다 노트 스폰 (초보자가 보기 편하게 4박자 간격으로 여유 있게 출현)
    function spawnNoteOnBeat(step, time) {
      if (step % 4 === 0) {
        const type = (step / 4) % 2 === 0 ? 0 : 1;
        notes.push(new BeatNote(time + travelDuration, type, travelDuration));
      }
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 3;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.alpha = 1;
        this.size = Math.random() * 5 + 3;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= 0.04;
      }
      draw(context) {
        context.save();
        context.globalAlpha = Math.max(0, this.alpha);
        context.fillStyle = this.color;
        context.beginPath();
        context.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        context.fill();
        context.restore();
      }
    }

    function triggerJudgment(type) {
      judgmentEl.textContent = type;
      judgmentEl.className = type.toLowerCase();
      if (type === 'PERFECT') {
        combo++;
        score += 100 + (combo * 10);
      } else {
        combo = 0;
      }
      scoreValEl.textContent = score;
      comboValEl.textContent = combo;

      setTimeout(() => {
        judgmentEl.style.opacity = '0';
      }, 300);
    }


    // ==========================================
    // 3. MediaPipe 초고속 반응 손바닥 트래킹
    // ==========================================
    const sabers = {
      0: { color: '#f43f5e', x: 0, y: 0, prevX: 0, prevY: 0, vx: 0, vy: 0, trail: [] },
      1: { color: '#38bdf8', x: 0, y: 0, prevX: 0, prevY: 0, vx: 0, vy: 0, trail: [] }
    };

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 0,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    hands.onResults(onHandResults);

    function onHandResults(results) {
      if (!results.multiHandLandmarks) return;

      for (let i = 0; i < results.multiHandLandmarks.length; i++) {
        const landmarks = results.multiHandLandmarks[i];
        const palmCenter = landmarks[9]; // 중지 관절 밑 손바닥 중심
        const curX = palmCenter.x * canvas.width;
        const curY = palmCenter.y * canvas.height;

        const saberId = curX < canvas.width / 2 ? 0 : 1;
        const s = sabers[saberId];

        s.vx = curX - s.x;
        s.vy = curY - s.y;
        s.prevX = s.x;
        s.prevY = s.y;
        s.x = curX;
        s.y = curY;

        s.trail.push({ x: curX, y: curY });
        if (s.trail.length > 5) s.trail.shift();

        checkSlice(s, saberId);
      }
    }

    function checkSlice(saber, saberType) {
      const speed = Math.hypot(saber.vx, saber.vy);
      // 최소 휘두름 속도 완화 (느린 속도에서도 손을 조금만 뻗으면 반응)
      if (speed < 6) return;

      const handDirX = saber.vx / speed;
      const handDirY = saber.vy / speed;

      for (let note of notes) {
        if (note.isHit || note.isMissed) continue;
        if (note.type !== saberType) continue;

        // 타격 판정 Z축 여유 대폭 확대 (±120)
        if (Math.abs(note.z - HIT_PLANE_Z) < 120) {
          const half = note.screenSize * 0.85;
          if (
            saber.x >= note.screenX - half &&
            saber.x <= note.screenX + half &&
            saber.y >= note.screenY - half &&
            saber.y <= note.screenY + half
          ) {
            const dotProduct = (handDirX * note.direction.dx) + (handDirY * note.direction.dy);

            // 각도 판정 완화 (약 70도 이내 방향 일치 시 통과)
            if (dotProduct > 0.35) {
              note.isHit = true;
              for (let i = 0; i < 20; i++) {
                particles.push(new Particle(note.screenX, note.screenY, note.color));
              }
              playSliceSound();
              triggerJudgment('PERFECT');
            }
          }
        }
      }
    }


    // ==========================================
    // 4. 메인 렌더링 루프
    // ==========================================
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      draw3DTunnel();

      const currentTime = audioCtx ? audioCtx.currentTime : 0;
      for (let i = notes.length - 1; i >= 0; i--) {
        notes[i].update(currentTime);
        notes[i].draw(ctx);
        if (notes[i].z < 40 || notes[i].isHit) {
          notes.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw(ctx);
        if (particles[i].alpha <= 0) {
          particles.splice(i, 1);
        }
      }

      drawSaber(sabers[0]);
      drawSaber(sabers[1]);

      requestAnimationFrame(render);
    }

    function draw3DTunnel() {
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      ctx.save();
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.2)';
      ctx.lineWidth = 2;

      ctx.strokeRect(cx - 70, cy - 45, 140, 90);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.strokeRect(cx - 320, cy - 210, 640, 420);

      ctx.beginPath();
      ctx.moveTo(cx - 70, cy - 45); ctx.lineTo(cx - 320, cy - 210);
      ctx.moveTo(cx + 70, cy - 45); ctx.lineTo(cx + 320, cy - 210);
      ctx.moveTo(cx - 70, cy + 45); ctx.lineTo(cx - 320, cy + 210);
      ctx.moveTo(cx + 70, cy + 45); ctx.lineTo(cx + 320, cy + 210);
      ctx.stroke();
      ctx.restore();
    }

    function drawSaber(saber) {
      if (saber.trail.length < 2) return;

      ctx.save();
      ctx.strokeStyle = saber.color;
      ctx.shadowColor = saber.color;
      ctx.shadowBlur = 20;
      ctx.lineCap = 'round';

      for (let i = 1; i < saber.trail.length; i++) {
        ctx.lineWidth = i * 3.5;
        ctx.beginPath();
        ctx.moveTo(saber.trail[i - 1].x, saber.trail[i - 1].y);
        ctx.lineTo(saber.trail[i].x, saber.trail[i].y);
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.arc(saber.x, saber.y, 16, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.shadowBlur = 30;
      ctx.fill();
      ctx.restore();
    }


    // ==========================================
    // 5. 속도 조절 이벤트 및 카메라 초기화
    // ==========================================
    const slider = document.getElementById('speed-slider');
    const speedText = document.getElementById('speed-text');
    const presetBtns = document.querySelectorAll('.preset-btn');

    function updateSpeed(val) {
      travelDuration = parseFloat(val);
      slider.value = travelDuration;
      speedText.textContent = `${travelDuration.toFixed(1)}초`;
    }

    slider.addEventListener('input', (e) => {
      updateSpeed(e.target.value);
      presetBtns.forEach(b => b.classList.remove('active'));
    });

    presetBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        presetBtns.forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        updateSpeed(e.target.getAttribute('data-speed'));
      });
    });

    const startBtn = document.getElementById('start-btn');
    const startModal = document.getElementById('start-modal');
    const video = document.getElementById('webcam');

    startBtn.addEventListener('click', async () => {
      startBtn.disabled = true;
      startBtn.textContent = '카메라 튜닝 중...';

      initAudio();

      const camera = new Camera(video, {
        onFrame: async () => {
          await hands.send({ image: video });
        },
        width: 480,
        height: 360
      });

      await camera.start();
      startModal.style.display = 'none';
      requestAnimationFrame(render);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D AI Air Beat Saber (Ultra Fast)</title>

  <!-- MediaPipe Hands & Camera Utils CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05050c;
      color: #fff;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    video {
      display: none;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1); /* 거울 모드 */
    }

    #hud {
      position: absolute;
      top: 24px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }
    .hud-box {
      background: rgba(15, 23, 42, 0.8);
      border: 2px solid rgba(255, 255, 255, 0.2);
      padding: 10px 24px;
      border-radius: 16px;
      text-align: center;
      backdrop-filter: blur(8px);
    }
    .hud-title {
      font-size: 0.85rem;
      color: #94a3b8;
      letter-spacing: 1.5px;
      font-weight: 700;
    }
    .hud-value {
      font-size: 2.2rem;
      font-weight: 900;
      color: #38bdf8;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.8);
    }
    #combo-value {
      color: #f43f5e;
      text-shadow: 0 0 15px rgba(244, 63, 94, 0.8);
    }
    #judgment {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3.5rem;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 2px;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.1s, transform 0.1s;
    }
    #judgment.perfect {
      color: #38bdf8;
      text-shadow: 0 0 30px #38bdf8;
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.15);
    }
    #judgment.miss {
      color: #64748b;
      text-shadow: 0 0 20px #475569;
      opacity: 1;
      transform: translate(-50%, -50%) scale(0.9);
    }

    #start-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 5, 12, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      text-align: center;
      padding: 24px;
    }
    #start-modal h1 {
      font-size: 3rem;
      font-weight: 900;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #f43f5e, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #start-modal p {
      font-size: 1.15rem;
      color: #cbd5e1;
      max-width: 580px;
      line-height: 1.8;
      margin-bottom: 30px;
    }
    #start-btn {
      background: linear-gradient(135deg, #f43f5e, #38bdf8);
      border: none;
      color: #fff;
      font-size: 1.25rem;
      font-weight: 800;
      padding: 16px 42px;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.6);
      transition: transform 0.2s;
    }
    #start-btn:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <video id="webcam" playsinline></video>
    <canvas id="game-canvas"></canvas>

    <div id="hud">
      <div class="hud-box">
        <div class="hud-title">SCORE</div>
        <div class="hud-value" id="score-value">0</div>
      </div>
      <div class="hud-box">
        <div class="hud-title">COMBO</div>
        <div class="hud-value" id="combo-value">0</div>
      </div>
    </div>

    <div id="judgment">PERFECT!</div>

    <div id="start-modal">
      <h1>⚡ 3D AIR BEAT SABER</h1>
      <p>
        🔴 <strong>왼손: 빨간 검</strong> &nbsp;|&nbsp; 🔵 <strong>오른손: 파란 검</strong><br>
        120BPM EDM 리듬에 맞춰 날아오는 블록을 화살표 방향으로 베어 넘기세요!<br>
        (초고속 반응 모드가 적용되어 손을 휘두르면 즉각 베어집니다)
      </p>
      <button id="start-btn">비트 시작하기 (카메라/사운드 On)</button>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. Web Audio API 고정밀 신디사이저 엔진
    // ==========================================
    const BPM = 120;
    const SECONDS_PER_BEAT = 60 / BPM; // 0.5초 = 1비트
    let audioCtx = null;
    let nextNoteTime = 0;
    let beatStep = 0;
    let isAudioPlaying = false;

    function initAudio() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      nextNoteTime = audioCtx.currentTime + 0.1;
      isAudioPlaying = true;
      scheduleMusic();
    }

    function scheduleMusic() {
      if (!isAudioPlaying) return;
      while (nextNoteTime < audioCtx.currentTime + 0.2) {
        playBeat(beatStep, nextNoteTime);
        spawnNoteOnBeat(beatStep, nextNoteTime);
        nextNoteTime += SECONDS_PER_BEAT / 2; // 8분음표 주기
        beatStep++;
      }
      setTimeout(scheduleMusic, 25);
    }

    function playBeat(step, time) {
      const isQuarterBeat = step % 2 === 0;
      const quarterIndex = (step / 2) % 4;

      // 4-on-the-floor 킥 드럼
      if (isQuarterBeat) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(140, time);
        osc.frequency.exponentialRampToValueAtTime(32, time + 0.11);
        gain.gain.setValueAtTime(0.7, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.13);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(time);
        osc.stop(time + 0.14);
      }

      // 스네어
      if (isQuarterBeat && (quarterIndex === 1 || quarterIndex === 3)) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(200, time);
        gain.gain.setValueAtTime(0.35, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.15);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(time);
        osc.stop(time + 0.16);
      }

      // 하이햇
      if (!isQuarterBeat) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(7500, time);
        gain.gain.setValueAtTime(0.12, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.035);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(time);
        osc.stop(time + 0.04);
      }
    }

    function playSliceSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(660, now);
      osc.frequency.exponentialRampToValueAtTime(1400, now + 0.08);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.11);
    }


    // ==========================================
    // 2. 3D 공간 수학 및 노트 엔진
    // ==========================================
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const scoreValEl = document.getElementById('score-value');
    const comboValEl = document.getElementById('combo-value');
    const judgmentEl = document.getElementById('judgment');

    let score = 0;
    let combo = 0;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const FOV = 420;
    const HIT_PLANE_Z = 130;
    const SPAWN_Z = 1200;
    const TRAVEL_DURATION = SECONDS_PER_BEAT * 4; // 2초에 걸쳐 도달

    let notes = [];
    let particles = [];

    const DIRECTIONS = {
      'UP':    { dx: 0,  dy: -1, symbol: '▲' },
      'DOWN':  { dx: 0,  dy: 1,  symbol: '▼' },
      'LEFT':  { dx: -1, dy: 0,  symbol: '◀' },
      'RIGHT': { dx: 1,  dy: 0,  symbol: '▶' }
    };
    const DIR_KEYS = ['UP', 'DOWN', 'LEFT', 'RIGHT'];

    class BeatNote {
      constructor(targetTime, type) {
        this.targetTime = targetTime;
        this.type = type; // 0: RED (Left), 1: BLUE (Right)
        this.color = type === 0 ? '#f43f5e' : '#38bdf8';
        this.dirKey = DIR_KEYS[Math.floor(Math.random() * DIR_KEYS.length)];
        this.direction = DIRECTIONS[this.dirKey];
        this.worldX = type === 0 ? -180 : 180;
        this.worldY = 40;
        this.size = 110;
        this.isHit = false;
        this.isMissed = false;
      }

      update(currentTime) {
        const timeRemaining = this.targetTime - currentTime;
        const progress = 1 - (timeRemaining / TRAVEL_DURATION);
        this.z = SPAWN_Z - progress * (SPAWN_Z - HIT_PLANE_Z);

        this.scale = FOV / this.z;
        this.screenX = (canvas.width / 2) + (this.worldX * this.scale);
        this.screenY = (canvas.height / 2) + (this.worldY * this.scale);
        this.screenSize = this.size * this.scale;

        if (timeRemaining < -0.16 && !this.isHit && !this.isMissed) {
          this.isMissed = true;
          triggerJudgment('MISS');
        }
      }

      draw(context) {
        if (this.z < 60 || this.isHit) return;

        context.save();
        context.translate(this.screenX, this.screenY);

        context.fillStyle = 'rgba(15, 23, 42, 0.85)';
        context.strokeStyle = this.color;
        context.lineWidth = Math.max(3, 7 * this.scale);
        context.shadowColor = this.color;
        context.shadowBlur = 15 * this.scale;

        const half = this.screenSize / 2;
        context.beginPath();
        context.roundRect(-half, -half, this.screenSize, this.screenSize, 12 * this.scale);
        context.fill();
        context.stroke();

        context.fillStyle = '#ffffff';
        context.font = `900 ${this.screenSize * 0.52}px sans-serif`;
        context.textAlign = 'center';
        context.textBaseline = 'middle';
        context.fillText(this.direction.symbol, 0, 0);

        context.restore();
      }
    }

    function spawnNoteOnBeat(step, time) {
      if (step % 2 === 0) {
        const type = (step / 2) % 2 === 0 ? 0 : 1;
        notes.push(new BeatNote(time + TRAVEL_DURATION, type));
      }
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 9 + 4;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.alpha = 1;
        this.size = Math.random() * 5 + 3;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= 0.04;
      }
      draw(context) {
        context.save();
        context.globalAlpha = Math.max(0, this.alpha);
        context.fillStyle = this.color;
        context.beginPath();
        context.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        context.fill();
        context.restore();
      }
    }

    function triggerJudgment(type) {
      judgmentEl.textContent = type;
      judgmentEl.className = type.toLowerCase();
      if (type === 'PERFECT') {
        combo++;
        score += 100 + (combo * 10);
      } else {
        combo = 0;
      }
      scoreValEl.textContent = score;
      comboValEl.textContent = combo;

      setTimeout(() => {
        judgmentEl.style.opacity = '0';
      }, 300);
    }


    // ==========================================================
    // 3. 초고속 반응 AI 및 손바닥 중심(Palm Center) 트래킹 최적화
    // ==========================================================
    const sabers = {
      0: { color: '#f43f5e', x: 0, y: 0, prevX: 0, prevY: 0, vx: 0, vy: 0, trail: [] }, // 왼손 (Red)
      1: { color: '#38bdf8', x: 0, y: 0, prevX: 0, prevY: 0, vx: 0, vy: 0, trail: [] }  // 오른손 (Blue)
    };

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    // ⚡ [핵심 최적화 1] modelComplexity: 0 (가장 가벼운 초고속 Lite 모델로 FPS 극대화)
    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 0,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    hands.onResults(onHandResults);

    function onHandResults(results) {
      if (!results.multiHandLandmarks) return;

      for (let i = 0; i < results.multiHandLandmarks.length; i++) {
        const landmarks = results.multiHandLandmarks[i];

        // ⚡ [핵심 최적화 2] 모션 블러에 취약한 손끝(8) 대신 손바닥 중심(9번 MCP) 추적
        const palmCenter = landmarks[9]; 
        const curX = palmCenter.x * canvas.width;
        const curY = palmCenter.y * canvas.height;

        // 화면 중심 기준 좌측/우측 손 분기
        const saberId = curX < canvas.width / 2 ? 0 : 1;
        const s = sabers[saberId];

        // ⚡ [핵심 최적화 3] 반응 지연 없는 즉각 속도 벡터 계산
        s.vx = curX - s.x;
        s.vy = curY - s.y;
        s.prevX = s.x;
        s.prevY = s.y;
        s.x = curX;
        s.y = curY;

        // 궤적 관리 (더 날렵하게 5개로 단축)
        s.trail.push({ x: curX, y: curY });
        if (s.trail.length > 5) s.trail.shift();

        // 즉각 슬라이스 검사
        checkSlice(s, saberId);
      }
    }

    // 선형대수학 벡터 내적 기반 슬라이스 판정
    function checkSlice(saber, saberType) {
      const speed = Math.hypot(saber.vx, saber.vy);
      // 손을 휘두르는 최소 속도 (약간만 움직여도 반응하도록 8로 최적화)
      if (speed < 8) return;

      const handDirX = saber.vx / speed;
      const handDirY = saber.vy / speed;

      for (let note of notes) {
        if (note.isHit || note.isMissed) continue;
        if (note.type !== saberType) continue;

        // 타격 판정 Z축 여유 구간 (초보자 및 빠른 스피드 대응)
        if (Math.abs(note.z - HIT_PLANE_Z) < 95) {
          const half = note.screenSize * 0.75; // 히트박스를 살짝 넉넉하게 보정
          if (
            saber.x >= note.screenX - half &&
            saber.x <= note.screenX + half &&
            saber.y >= note.screenY - half &&
            saber.y <= note.screenY + half
          ) {
            // 벡터 내적: cos(theta)
            const dotProduct = (handDirX * note.direction.dx) + (handDirY * note.direction.dy);

            // 60도 이내 방향 일치 시 판정 성공
            if (dotProduct > 0.45) {
              note.isHit = true;
              for (let i = 0; i < 20; i++) {
                particles.push(new Particle(note.screenX, note.screenY, note.color));
              }
              playSliceSound();
              triggerJudgment('PERFECT');
            }
          }
        }
      }
    }


    // ==========================================
    // 4. 고속 메인 렌더링 루프
    // ==========================================
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. 3D 네온 터널
      draw3DTunnel();

      // 2. 큐브 노트 렌더링
      const currentTime = audioCtx ? audioCtx.currentTime : 0;
      for (let i = notes.length - 1; i >= 0; i--) {
        notes[i].update(currentTime);
        notes[i].draw(ctx);
        if (notes[i].z < 40 || notes[i].isHit) {
          notes.splice(i, 1);
        }
      }

      // 3. 파티클
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw(ctx);
        if (particles[i].alpha <= 0) {
          particles.splice(i, 1);
        }
      }

      // 4. 광선검 렌더링
      drawSaber(sabers[0]);
      drawSaber(sabers[1]);

      requestAnimationFrame(render);
    }

    function draw3DTunnel() {
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      ctx.save();
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.2)';
      ctx.lineWidth = 2;

      ctx.strokeRect(cx - 70, cy - 45, 140, 90);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.strokeRect(cx - 320, cy - 210, 640, 420);

      ctx.beginPath();
      ctx.moveTo(cx - 70, cy - 45); ctx.lineTo(cx - 320, cy - 210);
      ctx.moveTo(cx + 70, cy - 45); ctx.lineTo(cx + 320, cy - 210);
      ctx.moveTo(cx - 70, cy + 45); ctx.lineTo(cx - 320, cy + 210);
      ctx.moveTo(cx + 70, cy + 45); ctx.lineTo(cx + 320, cy + 210);
      ctx.stroke();
      ctx.restore();
    }

    function drawSaber(saber) {
      if (saber.trail.length < 2) return;

      ctx.save();
      ctx.strokeStyle = saber.color;
      ctx.shadowColor = saber.color;
      ctx.shadowBlur = 20;
      ctx.lineCap = 'round';

      for (let i = 1; i < saber.trail.length; i++) {
        ctx.lineWidth = i * 3.5;
        ctx.beginPath();
        ctx.moveTo(saber.trail[i - 1].x, saber.trail[i - 1].y);
        ctx.lineTo(saber.trail[i].x, saber.trail[i].y);
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.arc(saber.x, saber.y, 16, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.shadowBlur = 30;
      ctx.fill();
      ctx.restore();
    }


    // ==========================================================
    // 5. 카메라 다운샘플링 초기화 (초경량 480x360 처리)
    // ==========================================================
    const startBtn = document.getElementById('start-btn');
    const startModal = document.getElementById('start-modal');
    const video = document.getElementById('webcam');

    startBtn.addEventListener('click', async () => {
      startBtn.disabled = true;
      startBtn.textContent = '카메라 튜닝 중...';

      initAudio();

      // ⚡ [핵심 최적화 4] 카메라 입력 해상도를 480x360으로 다운샘플링하여 추론 지연 제거
      const camera = new Camera(video, {
        onFrame: async () => {
          await hands.send({ image: video });
        },
        width: 480,
        height: 360
      });

      await camera.start();
      startModal.style.display = 'none';
      requestAnimationFrame(render);
    });
  </script>
</body>
</html>
